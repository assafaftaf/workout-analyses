name: Sync Garmin

# 8:00 בישראל כל יום. GitHub מריץ ב-UTC בלבד וישראל מחליפה שעון,
# לכן יש שתי הרצות והשלב הראשון עוצר את זו שאינה 8:00 מקומית.
# בכל הרצה נוצר טוקן Garmin טרי, כדי שלא נסתמך על טוקן שפג תוקפו.
on:
  schedule:
    - cron: "0 5 * * *"   # 8:00 בשעון קיץ
    - cron: "0 6 * * *"   # 8:00 בשעון חורף
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "כמה ימים אחורה לסרוק"
        required: false
        default: "10"
      debug:
        description: "הדפסת כל lap לצורך ניפוי"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: sync-garmin
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GARMIN_TOKEN_DIR: ${{ github.workspace }}/.garmin
    steps:
      - name: בדיקת שעה מקומית
        id: clock
        run: |
          HOUR=$(TZ=Asia/Jerusalem date +%-H)
          echo "השעה בישראל: ${HOUR}:00"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$HOUR" != "8" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "לא 8:00 מקומית, מדלג"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.clock.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.clock.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: התקנת תלויות
        if: steps.clock.outputs.run == 'true'
        run: pip install -r scripts/requirements.txt

      - name: יצירת טוקן Garmin טרי
        if: steps.clock.outputs.run == 'true'
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_MFA: ${{ secrets.GARMIN_MFA }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: python scripts/garmin_login.py

      - name: משיכת אימונים מ-Garmin
        if: steps.clock.outputs.run == 'true'
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL || 'gemini-3.6-flash' }}
          FTP: ${{ vars.FTP || '295' }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '10' }}
          MIN_LAP_SECONDS: ${{ vars.MIN_LAP_SECONDS || '120' }}
          DEBUG_LAPS: ${{ inputs.debug && '1' || '' }}
        run: python scripts/sync_garmin.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: מחיקת הטוקן מהריצה
        if: always()
        run: rm -rf "${{ github.workspace }}/.garmin"

      - name: דחיפת השינויים
        if: steps.clock.outputs.run == 'true'
        run: |
          if git diff --quiet -- laps.csv; then
            echo "אין שינוי ב-laps.csv"
            exit 0
          fi
          git config user.name "garmin-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add laps.csv
          git commit -m "sync: אימונים $(TZ=Asia/Jerusalem date +%F)"
          git push
